<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="background-color" content="#3B82F6" />
    <meta name="description" content="Namey — find your baby’s name with a fun guided quiz." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Namey" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet" />
    <title>Namey — Find your baby’s name</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #3B82F6; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #3B82F6;
        display: flex; align-items: flex-end; justify-content: flex-start;
        padding: 48px 28px;
        font-family: Nunito, system-ui, sans-serif;
        overflow: hidden;
      }
      #splash .slab {
        position: absolute; right: -12%; top: 10%;
        width: 58%; height: 70%;
        background: #F472B6;
        border-radius: 28px;
        transform: rotate(8deg);
      }
      #splash .word {
        position: relative; z-index: 1;
        color: #fff; font-weight: 800; font-size: clamp(2.4rem, 10vw, 3.2rem);
        letter-spacing: -0.03em; margin: 0;
      }
      #splash.hidden { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="slab"></span>
      <p class="word">Namey</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
